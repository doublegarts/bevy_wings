[workspace]
resolver = "3"
members = [
    # Shared
    "crates/shared/dga-bevy-wings-di",
    # Domain layer
    "crates/domain/dga-bevy-wings-domain",
    # Data layer
    "crates/data/dga-bevy-wings-data",
    # Presentation layer
    "crates/presentation/dga-bevy-wings-ui-core",
    "crates/presentation/dga-bevy-wings-ui-animation",
    "crates/presentation/dga-bevy-wings-ui-theme",
    "crates/presentation/dga-bevy-wings-ui-responsive",
    "crates/presentation/dga-bevy-wings-ui-modifier",
    "crates/presentation/dga-bevy-wings-ui-shaders",
    "crates/presentation/dga-bevy-wings-ui-widgets",
    "crates/presentation/dga-bevy-wings-ui-mvvm",
    "crates/presentation/dga-bevy-wings-ui-navigation",
    "examples/wings-gallery",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
authors = ["Gabriel Gheorghe"]
repository = "https://github.com/doublegarts/dga_bevy_wings_framework"
keywords = ["bevy", "ui", "framework", "mvvm", "ecs"]
categories = ["game-development", "gui"]

[workspace.dependencies]
bevy = { version = "0.20.0", default-features = false }
naga = { version = "30.0.1", features = ["wgsl-in"] }

dga-bevy-wings-ui-core = { path = "crates/presentation/dga-bevy-wings-ui-core", version = "0.1.0" }
dga-bevy-wings-ui-animation = { path = "crates/presentation/dga-bevy-wings-ui-animation", version = "0.1.0" }
dga-bevy-wings-ui-theme = { path = "crates/presentation/dga-bevy-wings-ui-theme", version = "0.1.0" }
dga-bevy-wings-ui-responsive = { path = "crates/presentation/dga-bevy-wings-ui-responsive", version = "0.1.0" }
dga-bevy-wings-ui-modifier = { path = "crates/presentation/dga-bevy-wings-ui-modifier", version = "0.1.0" }
dga-bevy-wings-ui-shaders = { path = "crates/presentation/dga-bevy-wings-ui-shaders", version = "0.1.0" }
dga-bevy-wings-ui-widgets = { path = "crates/presentation/dga-bevy-wings-ui-widgets", version = "0.1.0", default-features = false }
dga-bevy-wings-di = { path = "crates/shared/dga-bevy-wings-di", version = "0.1.0" }
dga-bevy-wings-domain = { path = "crates/domain/dga-bevy-wings-domain", version = "0.1.0" }
dga-bevy-wings-data = { path = "crates/data/dga-bevy-wings-data", version = "0.1.0" }
dga-bevy-wings-ui-mvvm = { path = "crates/presentation/dga-bevy-wings-ui-mvvm", version = "0.1.0" }
dga-bevy-wings-ui-navigation = { path = "crates/presentation/dga-bevy-wings-ui-navigation", version = "0.1.0" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

[package]
name = "dga-bevy-wings-framework"
description = "Layered app framework for Bevy 0.20: data, domain and presentation crates with ECS native widgets, theming, animation, navigation, dependency injection and MVVM."
readme = "README.md"
include = ["src/**", "examples/*.rs", "examples/support/**", "README.md", "LICENSE", "Cargo.toml", "Cargo.lock"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "dga_bevy_wings_framework"
path = "src/lib.rs"

[features]
default = ["shaders"]
## Custom UI shaders (requires the Bevy render stack).
shaders = ["dep:dga-bevy-wings-ui-shaders", "dga-bevy-wings-ui-widgets/shaders"]

[dependencies]
bevy = { workspace = true, features = ["std", "bevy_ui", "bevy_scene"] }
dga-bevy-wings-ui-core = { workspace = true }
dga-bevy-wings-ui-animation = { workspace = true }
dga-bevy-wings-ui-theme = { workspace = true }
dga-bevy-wings-ui-responsive = { workspace = true }
dga-bevy-wings-ui-modifier = { workspace = true }
dga-bevy-wings-ui-shaders = { workspace = true, optional = true }
dga-bevy-wings-ui-widgets = { workspace = true, default-features = false }
dga-bevy-wings-di = { workspace = true }
dga-bevy-wings-domain = { workspace = true }
dga-bevy-wings-data = { workspace = true }
dga-bevy-wings-ui-mvvm = { workspace = true }
dga-bevy-wings-ui-navigation = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
bevy = { workspace = true, features = ["default_app", "ui_api", "ui_bevy_render", "scene", "bevy_ui_widgets", "bevy_picking", "ui_picking", "bevy_winit", "x11", "std", "multi_threaded", "default_font"] }

[[example]]
name = "shaders"
required-features = ["shaders"]
