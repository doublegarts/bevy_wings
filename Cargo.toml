[workspace]
resolver = "3"
members = [
    # Shared
    "crates/shared/bevy_wings_di",
    # Domain layer
    "crates/domain/bevy_wings_domain",
    # Data layer
    "crates/data/bevy_wings_data",
    # Presentation layer
    "crates/presentation/bevy_wings_ui_core",
    "crates/presentation/bevy_wings_ui_animation",
    "crates/presentation/bevy_wings_ui_theme",
    "crates/presentation/bevy_wings_ui_responsive",
    "crates/presentation/bevy_wings_ui_modifiers",
    "crates/presentation/bevy_wings_ui_shaders",
    "crates/presentation/bevy_wings_ui_widgets",
    "crates/presentation/bevy_wings_ui_mvvm",
    "crates/presentation/bevy_wings_ui_navigation",
    "examples/wings-gallery",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
authors = ["Gabriel Gheorghe"]
repository = "https://github.com/doublegarts/bevy_wings"
keywords = ["bevy", "ui", "framework", "mvvm", "ecs"]
categories = ["game-development", "gui"]

[workspace.dependencies]
bevy = { version = "0.20.0", default-features = false }
naga = { version = "30.0.1", features = ["wgsl-in"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
serde_json = "1.0.154"
redb = "4.4.0"
ureq = "3.4.2"

bevy_wings_ui_core = { path = "crates/presentation/bevy_wings_ui_core", version = "0.2.0" }
bevy_wings_ui_animation = { path = "crates/presentation/bevy_wings_ui_animation", version = "0.2.0" }
bevy_wings_ui_theme = { path = "crates/presentation/bevy_wings_ui_theme", version = "0.2.0" }
bevy_wings_ui_responsive = { path = "crates/presentation/bevy_wings_ui_responsive", version = "0.2.0" }
bevy_wings_ui_modifiers = { path = "crates/presentation/bevy_wings_ui_modifiers", version = "0.2.0" }
bevy_wings_ui_shaders = { path = "crates/presentation/bevy_wings_ui_shaders", version = "0.2.0" }
bevy_wings_ui_widgets = { path = "crates/presentation/bevy_wings_ui_widgets", version = "0.2.0", default-features = false }
bevy_wings_di = { path = "crates/shared/bevy_wings_di", version = "0.2.0" }
bevy_wings_domain = { path = "crates/domain/bevy_wings_domain", version = "0.2.0" }
bevy_wings_data = { path = "crates/data/bevy_wings_data", version = "0.2.0" }
bevy_wings_ui_mvvm = { path = "crates/presentation/bevy_wings_ui_mvvm", version = "0.2.0" }
bevy_wings_ui_navigation = { path = "crates/presentation/bevy_wings_ui_navigation", version = "0.2.0" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

[package]
name = "bevy_wings"
description = "Layered app framework for Bevy 0.20: data, domain and presentation crates with ECS native widgets, theming, animation, navigation, dependency injection and MVVM."
readme = "README.md"
include = ["src/**", "examples/*.rs", "examples/support/**", "README.md", "LICENSE", "Cargo.toml", "Cargo.lock"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "bevy_wings"
path = "src/lib.rs"

[features]
default = ["shaders", "native"]
## Reads safe areas from the platform (iOS, Android, macOS title bars).
native = ["bevy_wings_ui_responsive/native"]
## Custom UI shaders (requires the Bevy render stack).
shaders = ["dep:bevy_wings_ui_shaders", "bevy_wings_ui_widgets/shaders"]
## Embedded database data source (redb).
database = ["bevy_wings_data/database"]
## HTTP remote data source (ureq).
http = ["bevy_wings_data/http"]

[dependencies]
bevy = { workspace = true, features = ["std", "bevy_ui", "bevy_scene"] }
bevy_wings_ui_core = { workspace = true }
bevy_wings_ui_animation = { workspace = true }
bevy_wings_ui_theme = { workspace = true }
bevy_wings_ui_responsive = { workspace = true }
bevy_wings_ui_modifiers = { workspace = true }
bevy_wings_ui_shaders = { workspace = true, optional = true }
bevy_wings_ui_widgets = { workspace = true, default-features = false }
bevy_wings_di = { workspace = true }
bevy_wings_domain = { workspace = true }
bevy_wings_data = { workspace = true }
bevy_wings_ui_mvvm = { workspace = true }
bevy_wings_ui_navigation = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
bevy = { workspace = true, features = ["default_app", "ui_api", "ui_bevy_render", "scene", "bevy_ui_widgets", "bevy_picking", "ui_picking", "bevy_winit", "x11", "std", "multi_threaded", "default_font"] }

[[example]]
name = "shaders"
required-features = ["shaders"]
