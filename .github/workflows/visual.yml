name: Visual regression

# Renders the gallery in every design, light and dark, desktop and phone sizes, on a macOS
# runner (Metal GPU) and compares the screenshots with tests/visual/macos/.
#
# To accept intentional changes, run this workflow by hand with "update" checked, download the
# "visual-baselines" artifact and replace tests/visual/macos/ with it.

on:
  pull_request:
    paths:
      - 'crates/presentation/**'
      - 'examples/wings-gallery/**'
      - 'tests/visual/**'
      - 'scripts/visual-regression.py'
      - '.github/workflows/visual.yml'
  workflow_dispatch:
    inputs:
      update:
        description: Render new baselines instead of comparing
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  screenshots:
    name: Gallery screenshots (macOS, Metal)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Compare with baselines
        if: ${{ !inputs.update }}
        run: python3 scripts/visual-regression.py --release
      - name: Render new baselines
        if: ${{ inputs.update }}
        run: python3 scripts/visual-regression.py --release --update --baselines target/visual/baselines
      - name: Upload renders and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-results
          path: |
            target/visual/actual
            target/visual/diff
          if-no-files-found: ignore
      - name: Upload new baselines
        if: ${{ inputs.update }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: target/visual/baselines
