name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Bevy's debug symbols across many example binaries can exhaust hosted runner storage.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test libraries, gallery and focused examples
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Test documentation examples
        run: cargo test --workspace --doc --all-features --locked
      - name: Docs build without warnings
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Run terminal examples
        run: |
          for example in domain data di state; do
            cargo run --locked --example "$example"
          done

  no-shaders:
    name: Without shaders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev
      # The gallery enables the facade's default shaders feature, so exclude it here.
      - name: Check the facade without example dependencies
        run: cargo check -p bevy_wings --lib --no-default-features --locked
      - run: cargo clippy --workspace --exclude wings-gallery --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test --workspace --exclude wings-gallery --all-targets --no-default-features --locked
      - run: cargo test --workspace --exclude wings-gallery --doc --no-default-features --locked
      - run: cargo doc --workspace --exclude wings-gallery --no-default-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  package:
    name: Release packages and MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev
      - run: python3 scripts/check-release.py
      - name: Check the minimum supported Rust version
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Verify every crate from its packaged sources
        run: cargo publish --workspace --exclude wings-gallery --dry-run --locked
