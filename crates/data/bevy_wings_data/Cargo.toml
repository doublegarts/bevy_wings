[package]
name = "bevy_wings_data"
description = "Data layer of the Wings framework: data sources, offline first repositories, caching policies, mappers and ECS integrated background loading."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
## Embedded database source (redb).
database = ["dep:redb"]
## HTTP client for `HttpRemote` (ureq with rustls).
http = ["dep:ureq"]

[dependencies]
bevy = { workspace = true, features = ["std"] }
bevy_wings_domain = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
redb = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

[lints]
workspace = true
