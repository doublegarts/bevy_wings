[package]
name = "bevy_wings_ui_widgets"
description = "Themed, animated, ECS native widgets for Bevy UI built with bsn! scenes: WingsButton, WingsText, WingsCard, WingsSwitch, WingsSlider and many more."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["shaders"]
## Shader backed widgets (ripple, circular progress, skeleton shimmer).
shaders = ["dep:bevy_wings_ui_shaders"]

[dependencies]
bevy = { workspace = true, features = ["std", "bevy_ui", "bevy_text", "bevy_scene", "bevy_asset", "bevy_ui_widgets", "bevy_input_focus", "bevy_picking", "ui_picking", "bevy_log", "bevy_image"] }
bevy_wings_ui_core = { workspace = true }
bevy_wings_ui_animation = { workspace = true }
bevy_wings_ui_theme = { workspace = true }
bevy_wings_ui_responsive = { workspace = true }
bevy_wings_ui_modifiers = { workspace = true }
bevy_wings_ui_shaders = { workspace = true, optional = true }

[lints]
workspace = true

[[bench]]
name = "stress"
harness = false
