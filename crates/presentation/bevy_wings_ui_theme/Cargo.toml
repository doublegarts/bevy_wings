[package]
name = "bevy_wings_ui_theme"
description = "ECS theming for Bevy Wings UI: color roles, light and dark schemes, typography, shapes, elevation and live theme switching."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bevy = { workspace = true, features = ["std", "bevy_ui", "bevy_text", "bevy_color", "bevy_window"] }
bevy_wings_ui_core = { workspace = true }
bevy_wings_ui_animation = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

# On Apple platforms the Apple designs use the system UI font (San Francisco), which Bevy finds
# through its system font discovery. Wings never bundles Apple fonts.
[target.'cfg(target_vendor = "apple")'.dependencies]
bevy = { workspace = true, features = ["system_font_discovery"] }

[lints]
workspace = true
