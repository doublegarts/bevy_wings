[package]
name = "dga-bevy-wings-ui-widgets"
description = "Themed, animated, ECS native widgets for Bevy UI built with bsn! scenes: WingsButton, WingsText, WingsCard, WingsSwitch, WingsSlider and many more."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["shaders"]
## Shader backed widgets (ripple, circular progress, skeleton shimmer).
shaders = ["dep:dga-bevy-wings-ui-shaders"]

[dependencies]
bevy = { workspace = true, features = ["std", "bevy_ui", "bevy_text", "bevy_scene", "bevy_asset", "bevy_ui_widgets", "bevy_input_focus", "bevy_picking", "ui_picking", "bevy_log", "bevy_image"] }
dga-bevy-wings-ui-core = { workspace = true }
dga-bevy-wings-ui-animation = { workspace = true }
dga-bevy-wings-ui-theme = { workspace = true }
dga-bevy-wings-ui-responsive = { workspace = true }
dga-bevy-wings-ui-modifier = { workspace = true }
dga-bevy-wings-ui-shaders = { workspace = true, optional = true }

[lints]
workspace = true
